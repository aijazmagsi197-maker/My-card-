
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirchi 360 - Official Menu</title>
    
    <style>
        :root { --primary: #e67e22; --dark: #2c3e50; --green: #27ae60; }
        body { font-family: 'Arial', sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        .bill-card { background: white; width: 340px; border-radius: 0; box-shadow: 0 5px 15px rgba(0,0,0,0.1); padding: 20px; border-top: 5px solid var(--primary); position: relative; }
        .bill-card::after { content: ""; position: absolute; bottom: -10px; left: 0; width: 100%; height: 10px; background: linear-gradient(-45deg, white 5px, transparent 0), linear-gradient(45deg, white 5px, transparent 0); background-size: 10px 10px; }

        .header { text-align: center; border-bottom: 2px dashed #ddd; padding-bottom: 10px; }
        .header h1 { margin: 5px 0; color: var(--primary); font-size: 24px; letter-spacing: 2px; }
        .header p { margin: 0; font-size: 12px; color: #777; }

        .section { margin-top: 20px; }
        label { display: block; font-size: 13px; font-weight: bold; color: var(--dark); margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 15px; font-size: 14px; }

        .receipt-area { background: #fdfdfd; border: 1px solid #eee; padding: 15px; margin-top: 10px; }
        .receipt-line { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .total-line { border-top: 2px solid var(--dark); margin-top: 10px; padding-top: 10px; display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; color: var(--green); }

        .order-btn { width: 100%; background: var(--green); color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 20px; transition: 0.3s; }
        .order-btn:hover { background: #219150; }

        .developer-tag { text-align: center; margin-top: 30px; font-size: 10px; color: #999; border-top: 1px solid #eee; padding-top: 10px; }
        .developer-tag b { color: var(--dark); }
    </style>
</head>
<body>

<div class="bill-card">
    <div class="header">
        <h1>MIRCHI 360⁰</h1>
        <p>ORDERING RECEIPT SYSTEM</p>
    </div>

    <div class="section">
        <label>SELECT FOOD ITEM</label>
        <select id="item" onchange="generateBill()">
            <option value="380">Zinger Burger - Rs 380</option>
            <option value="450">Chicken Cheese Burger - Rs 450</option>
            <option value="950">Tikka Pizza (M) - Rs 950</option>
            <option value="1450">Mirchi Special (L) - Rs 1450</option>
            <option value="250">Zinger Roll - Rs 250</option>
            <option value="350">Club Sandwich - Rs 350</option>
            <option value="300">Loaded Fries - Rs 300</option>
            <option value="120">Soft Drink - Rs 120</option>
        </select>

        <label>QUANTITY</label>
        <input type="number" id="qty" value="1" min="1" oninput="generateBill()">
    </div>

    <div class="receipt-area">
        <div class="receipt-line">
            <span>Item:</span>
            <span id="res-name">Zinger Burger</span>
        </div>
        <div class="receipt-line">
            <span>Price:</span>
            <span id="res-price">Rs 380</span>
        </div>
        <div class="receipt-line">
            <span>Qty:</span>
            <span id="res-qty">1</span>
        </div>
        <div class="total-line">
            <span>NET TOTAL:</span>
            <span id="totalAmount">Rs 380</span>
        </div>
    </div>

    <button class="order-btn" onclick="confirmOrder()">CONFIRM ORDER</button>

    <div class="developer-tag">
        SYSTEM DESIGNED BY:<br>
        <b>AIJAZ ALI DEVELOPMENTS</b>
    </div>
</div>

<script>
    function generateBill() {
        var itemSelect = document.getElementById("item");
        var price = itemSelect.value;
        var qty = document.getElementById("qty").value;
        var itemName = itemSelect.options[itemSelect.selectedIndex].text.split('-')[0];

        var total = price * qty;

        // Updating Receipt UI
        document.getElementById("res-name").innerText = itemName;
        document.getElementById("res-price").innerText = "Rs " + price;
        document.getElementById("res-qty").innerText = qty;
        document.getElementById("totalAmount").innerText = "Rs " + total;
    }

    function confirmOrder() {
        var item = document.getElementById("res-name").innerText;
        var qty = document.getElementById("res-qty").innerText;
        var total = document.getElementById("totalAmount").innerText;
        var phone = "923083360360";
        
        var message = "*ORDER RECEIPT - MIRCHI 360*%0A" +
                      "----------------------------%0A" +
                      "*Item:* " + item + "%0A" +
                      "*Quantity:* " + qty + "%0A" +
                      "*Total Bill:* " + total + "%0A" +
                      "----------------------------%0A" +
                      "Please prepare my order.";
        
        window.open("https://wa.me/" + phone + "?text=" + message);
    }
</script>

</body>
</html>
