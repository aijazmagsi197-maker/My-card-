<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Sukoon Restaurant - Digital Card</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f3; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { width: 340px; background: white; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; text-align: center; border-top: 8px solid #d35400; }
        .header { background: #fff; padding: 25px 15px; }
        .header h1 { margin: 0; font-size: 22px; color: #d35400; text-transform: uppercase; letter-spacing: 1px; }
        .header p { margin: 5px 0 0; font-size: 13px; color: #7f8c8d; }
        .content { padding: 20px; }
        .speciality { background: #fdf2e9; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #d35400; font-size: 14px; color: #2c3e50; text-align: left; }
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; margin: 12px 0; border-radius: 8px; text-decoration: none; color: white; font-weight: 600; font-size: 15px; transition: 0.3s; box-sizing: border-box; }
        .btn-call { background-color: #27ae60; }
        .btn-whatsapp { background-color: #25D366; }
        .btn-fb { background-color: #1877F2; }
        .btn-map { background-color: #e74c3c; }
        .footer { background: #2c3e50; color: #bdc3c7; padding: 15px; font-size: 12px; }
        .footer span { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>New Sukoon Restaurant</h1>
        <p>The Taste of Nawabshah Since Years</p>
    </div>

    <div class="content">
        <div class="speciality">
            <strong>Popular Dishes:</strong><br>
            Fried Fish, Chicken Karahi, Special BBQ & Platters.
        </div>

        <a href="tel:03068294853" class="btn btn-call">📞 Call Now / Order</a>

        <a href="https://wa.me/923068294853?text=Hello! I want to place an order." class="btn btn-whatsapp">💬 WhatsApp Order</a>

        <a href="https://www.facebook.com/p/New-Sukoon-Resturent-100063990814986/" class="btn btn-fb">📘 Facebook Page</a>

        <a href="https://maps.app.goo.gl/Py1sBgBNSjkRgRubF" class="btn btn-map">📍 View on Google Maps</a>
    </div>

    <div class="footer">
        Designed by: <span>Aijaz Ali</span><br>
        Smart Tech & Job News
    </div>
</div>

</body>
</html>
