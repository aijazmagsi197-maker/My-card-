<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aijaz Ali Card</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 20px; text-align: center; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 6px solid #28a745; }
        .profile-img { width: 100%; border-radius: 15px; margin-bottom: 15px; border: 2px solid #ddd; }
        h1 { font-size: 26px; color: #333; margin: 10px 0; }
        p { color: #666; font-size: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="1770427075814.png" alt="Aijaz Ali" class="profile-img">
        <h1>Aijaz Ali</h1>
        <p>Web Developer</p>
    </div>
</body>
</html>
