<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Sukoon Restaurant - Digital Card</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            width: 320px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: #e67e22;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            margin: 0 auto 15px;
            font-weight: bold;
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 5px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .developer {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 13px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .btn {
            display: block;
            background: #27ae60;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background: #219150;
        }
        .btn-call { background: #2980b9; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">S</div>
        <h1>New Sukoon Restaurant</h1>
        <p>Best Food in Nawabshah City</p>
        
        <div class="developer">Created by: Aijaz Ali</div>

        <a href="tel:03068294853" class="btn btn-call">📞 Call Now</a>
        <a href="https://maps.google.com" target="_blank" class="btn">📍 View Location</a>
        <a href="https://aijazsmartnews786.blogspot.com" target="_blank" class="btn" style="background: #e67e22;">🌐 Visit Website</a>
    </div>

</body>
</html>
