<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mirchi 360 - Official Menu</title>
    
    <style>
        :root { --primary: #e67e22; --dark: #2c3e50; --green: #27ae60; }
        
        /* پورے پیج کو سیٹ کیا تاکہ کارڈ بیچ میں اور بڑا لگے */
        body { 
            font-family: 'Arial', sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            padding: 10px;
            margin: 0;
        }
        
        /* کارڈ کو بڑا اور موبائل اسکرین کے مطابق کیا */
        .bill-card { 
            background: white; 
            width: 100%; 
            max-width: 450px; /* پہلے یہ 340 تھا، اب بڑا کر دیا ہے */
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            padding: 25px; 
            border-top: 10px solid var(--primary);
            box-sizing: border-box;
        }

        .header { text-align: center; border-bottom: 3px dashed #eee; padding-bottom: 15px; }
        .header h1 { margin: 5px 0; color: var(--primary); font-size: 32px; letter-spacing: 2px; }
        .header p { margin: 0; font-size: 14px; color: #777; font-weight: bold; }

        .section { margin-top: 25px; }
        label { display: block; font-size: 16px; font-weight: bold; color: var(--dark); margin-bottom: 8px; }
        
        /* ان پٹ ڈبوں کو بڑا کیا تاکہ انگلی سے دبانے میں آسانی ہو */
        select, input { 
            width: 100%; 
            padding: 15px; 
            border: 2px solid #ddd; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            font-size: 18px; 
            box-sizing: border-box;
        }

        .receipt-area { background: #fafafa; border: 2px solid #eee; padding: 20px; border-radius: 10px; }
        .receipt-line { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 18px; }
        
        .total-line { 
            border-top: 3px solid var(--dark); 
            margin-top: 15px; 
            padding-top: 15px; 
            display: flex; 
            justify-content: space-between; 
            font-weight: bold; 
            font-size: 24px; 
            color: var(--green); 
        }

        .order-btn { 
            width: 100%; 
            background: var(--green); 
            color: white; 
            border: none; 
            padding: 18px; 
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 12px; 
            margin-top: 25px; 
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }

        .developer-tag { text-align: center; margin-top: 30px; font-size: 12px; color: #999; border-top: 1px solid #eee; padding-top: 15px; }
        .developer-tag b { color: var(--primary); font-size: 14px; }
    </style>
</head>
<body>

<div class="bill-card">
    <div class="header">
        <h1>MIRCHI 360⁰</h1>
        <p>SMART RECEIPT SYSTEM</p>
    </div>

    <div class="section">
        <label>SELECT FOOD ITEM</label>
        <select id="item" onchange="generateBill()">
            <option value="380">Zinger Burger - Rs 380</option>
            <option value="450">Chicken Cheese Burger - Rs 450</option>
            <option value="950">Tikka Pizza (M) - Rs 950</option>
            <option value="1450">Mirchi Special (L) - Rs 1450</option>
            <option value="250">Zinger Roll - Rs 250</option>
            <option value="350">Club Sandwich - Rs 350</option>
            <option value="300">Loaded Fries - Rs 300</option>
            <option value="120">Soft Drink - Rs 120</option>
        </select>

        <label>QUANTITY</label>
        <input type="number" id="qty" value="1" min="1" oninput="generateBill()">
    </div>

    <div class="receipt-area">
        <div class="receipt-line">
            <span>Item:</span>
            <span id="res-name" style="font-weight:bold;">Zinger Burger</span>
        </div>
        <div class="receipt-line">
            <span>Price:</span>
            <span id="res-price">Rs 380</span>
        </div>
        <div class="receipt-line">
            <span>Qty:</span>
            <span id="res-qty">1</span>
        </div>
        <div class="total-line">
            <span>NET TOTAL:</span>
            <span id="totalAmount">Rs 380</span>
        </div>
    </div>

    <button class="order-btn" onclick="confirmOrder()">CONFIRM ORDER</button>

    <div class="developer-tag">
        SYSTEM DESIGNED BY:<br>
        <b>AIJAZ ALI DEVELOPMENTS</b>
    </div>
</div>

<script>
    function generateBill() {
        var itemSelect = document.getElementById("item");
        var price = itemSelect.value;
        var qty = document.getElementById("qty").value;
        var itemName = itemSelect.options[itemSelect.selectedIndex].text.split('-')[0];

        var total = price * qty;

        document.getElementById("res-name").innerText = itemName;
        document.getElementById("res-price").innerText = "Rs " + price;
        document.getElementById("res-qty").innerText = qty;
        document.getElementById("totalAmount").innerText = "Rs " + total;
    }

    function confirmOrder() {
        var item = document.getElementById("res-name").innerText;
        var qty = document.getElementById("res-qty").innerText;
        var total = document.getElementById("totalAmount").innerText;
        var phone = "923083360360";
        
        var message = "*ORDER RECEIPT - MIRCHI 360*%0A" +
                      "----------------------------%0A" +
                      "*Item:* " + item + "%0A" +
                      "*Quantity:* " + qty + "%0A" +
                      "*Total Bill:* " + total + "%0A" +
                      "----------------------------%0A" +
                      "Please prepare my order.";
        
        window.open("https://wa.me/" + phone + "?text=" + message);
    }
</script>

</body>
</html>
